[project]
name = "desktop-chatbot-ui"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
]

# Security floors. Caps keep anyio, mistune, and tornado on the patched line.
[tool.uv]
constraint-dependencies = [
    "anyio>=4.14.2,<4.15",
    "certifi>=2026.10.18",
    "jupyter-server>=2.21.1",
    "mistune>=3.3.3,<3.4",
    "nbconvert>=7.17.2",
    "pillow>=13.0.0",
    "soupsieve>=4.0",
    "tornado>=6.5.9,<6.6",
    "urllib3>=2.8.0",
]
